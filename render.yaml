services:
  # DocuMind AI - Express Backend Service
  - type: web
    name: documind-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: documind-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: CHROMA_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # DocuMind AI - Next.js Frontend Service
  - type: web
    name: documind-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://documind-backend.onrender.com/api
      - key: BACKEND_URL
        value: https://documind-backend.onrender.com

databases:
  - name: documind-postgres
    plan: free
    databaseName: documind
    user: documind_admin
